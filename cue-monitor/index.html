<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S<span>.</span></div>
        <div>
          <div class="brand-top">SOWN<span>LIGHTING</span></div>
          <div class="brand-bottom">CUE MONITOR <b>V0.1</b></div>
        </div>
      </div>
      <div class="header-actions">
        <span class="save-state" id="saveState"><span class="save-dot"></span> Lưu trên máy</span>
        <button class="btn btn-quiet btn-sm" type="button" data-action="import">Nhập JSON</button>
        <button class="btn btn-quiet btn-sm" type="button" data-action="export">Xuất backup</button>

      </div>
    </div>

      <aside class="sidebar" aria-label="Danh sách các phần trong show">

<script>
/* SOWN Cue Monitor v0.1 — all data stays in this browser unless exported. */
(() => {
  'use strict';
  const KEY = 'sown_cue_monitor_data_v01';
  const COLORS = ['amber', 'red', 'blue', 'green', 'purple'];
  const $ = (selector) => document.querySelector(selector);

  const txt = (value, fallback = 'Chưa ghi chú') => value ? esc(value) : `<span class="muted">${esc(fallback)}</span>`;
  const newId = () => (crypto.randomUUID?.() || ('id_' + Date.now() + '_' + Math.random().toString(36).slice(2)));
  const cap = (v, max = 2500) => String(v ?? '').slice(0, max);
  let toastTimer;

  const sample = () => {
    const id1 = newId(), id2 = newId();
    const m1 = newId(), m2 = newId(), m3 = newId(), m4 = newId(), m5 = newId();
    return {
      schema:1, name:'DEMO / SHOW RUNDOWN', mode:'rehearsal', selectedSectionId:id1, cursorId:m1,
      ended:false, doneIds:[], sections:[

  function normalize(obj) {
    if (!obj || typeof obj !== 'object' || !Array.isArray(obj.sections)) throw Error('File JSON không có cấu trúc Show hợp lệ.');
    if (obj.sections.length > 100) throw Error('Show có quá nhiều phần (giới hạn 100).');
    const sectionMap = new Map(), momentMap = new Map();
    let momentCount = 0;
    const sections = obj.sections.map(s => {
      const sectionId = newId();
      sectionMap.set(String(s.id), sectionId);
      if (!Array.isArray(s.moments)) throw Error('Một phần trong show không có danh sách moment hợp lệ.');
      momentCount += s.moments.length;
      if (momentCount > 2000) throw Error('Show có quá nhiều moment (giới hạn 2000).');
      return {id:sectionId,name:cap(s.name,140) || 'Phần chưa đặt tên',notes:cap(s.notes),moments:s.moments.map(m => {
        const mid = newId(); momentMap.set(String(m.id),mid);
        return {id:mid,title:cap(m.title,180)||'Moment chưa đặt tên',trigger:cap(m.trigger),prepare:cap(m.prepare),action:cap(m.action),executor:cap(m.executor,180),cue:cap(m.cue,180),notes:cap(m.notes),color:COLORS.includes(m.color) ? m.color : 'amber'};
      })};
    });
    const first = sections.flatMap(s=>s.moments)[0]?.id || null;
    const done = Array.isArray(obj.doneIds) ? [...new Set(obj.doneIds.map(x=>momentMap.get(String(x))).filter(Boolean))] : [];
    return {schema:1,name:cap(obj.name,140)||'SHOW MỚI',mode:obj.mode==='show'?'show':'rehearsal',selectedSectionId:sectionMap.get(String(obj.selectedSectionId)) || sections[0]?.id || null,cursorId:momentMap.get(String(obj.cursorId))||first,ended:!!obj.ended && !!first,doneIds:done,sections};
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return sample();
      const parsed = JSON.parse(raw);
      // Use the same normalization for imported and locally restored data.
      return normalize(parsed);
    } catch (err) {
      console.warn('Could not read saved rundown:', err);
      return sample();
    }
  }
  let state = load();
  function save() {

  function commit({scrollTop=false}={}) { save(); render(); if (scrollTop) window.scrollTo({top:0,behavior:'instant'}); }

  function flatMoments() {return state.sections.flatMap(section => section.moments.map((moment,index)=>({...moment,sectionId:section.id,sectionName:section.name,sectionIndex:index})));}
  function allCount() {return state.sections.reduce((n,s)=>n+s.moments.length,0);}

    state.doneIds=state.doneIds.filter(id=>arr.some(m=>m.id===id));
    if (!state.sections.some(s=>s.id===state.selectedSectionId)) state.selectedSectionId=state.sections[0]?.id||null;

    </div>`;
  }

  function renderShow() {

      <div class="live-notice">Chỉ nhắc thao tác, KHÔNG gửi GO / OFF / GOTO đến grandMA2. Bấm “Đã xong” sau khi thực hiện trên bàn.</div>

      ${prev?`<div class="upcoming-card last"><small>MOMENT VỪA QUA</small><strong>${esc(prev.title)}</strong><span>${esc(prev.sectionName)}</span></div>`:''}
      <div class="heading-actions"><button class="btn btn-quiet btn-sm" data-action="edit-moment" data-id="${active.id}">✎ Chỉnh ghi chú moment này</button><button class="btn btn-quiet btn-sm" data-action="reset">↺ Reset trạng thái show</button></div>

  function input(name,label,value='',extra='') {return `<div class="form-field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" value="${esc(value)}" ${extra}></div>`;}
  function area(name,label,value='',placeholder='') {return `<div class="form-field"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" rows="2" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;}
  function foot() {return `<div class="form-actions"><button type="button" class="btn btn-quiet" data-action="close-dialog">Hủy</button><button type="submit" class="btn btn-accent">LƯU THAY ĐỔI</button></div>`;}
  function openDialog(type,id=null,sectionId=null) {

  function editorSubmit(e) {
    e.preventDefault();
    const dlg=$('#editorDialog');const f=new FormData(e.currentTarget);
    const type=dlg.dataset.type,id=dlg.dataset.id,sectionId=dlg.dataset.sectionId;
    const val=(name,max=2500)=>cap(f.get(name),max).trim();
    if(type==='show') {if(!val('name',140))return;state.name=val('name',140);}
    else if(type==='section') {
      const name=val('name',140);if(!name) return;
      if(id) {const s=findSection(id);if(!s)return;s.name=name;s.notes=val('notes');}
      else {const s={id:newId(),name,notes:val('notes'),moments:[]};state.sections.push(s);state.selectedSectionId=s.id;}
    } else if(type==='moment') {
      const s=findSection(sectionId);if(!s)return;
      const title=val('title',180);if(!title)return;
      const m={title,trigger:val('trigger'),prepare:val('prepare'),action:val('action'),executor:val('executor',180),cue:val('cue',180),notes:val('notes'),color:COLORS.includes(val('color'))?val('color'):'amber'};
      if(id){const target=s.moments.find(x=>x.id===id);if(!target)return;Object.assign(target,m);}

  function locateMoment(id){for(const s of state.sections){const index=s.moments.findIndex(m=>m.id===id);if(index!==-1)return {section:s,index,moment:s.moments[index]};}return null;}
  function moveItem(array,index,direction){const to=index+direction;if(to<0||to>=array.length)return;[array[index],array[to]]=[array[to],array[index]];}
  function next() {const arr=flatMoments();if(!arr.length)return;const idx=arr.findIndex(m=>m.id===state.cursorId);if(idx<0||state.ended)return;state.doneIds=[...new Set([...state.doneIds,state.cursorId])];if(idx===arr.length-1)state.ended=true;else state.cursorId=arr[idx+1].id;commit({scrollTop:true});}
  function previous(){const arr=flatMoments();if(state.ended){state.ended=false;state.doneIds=state.doneIds.filter(x=>x!==state.cursorId);commit({scrollTop:true});return;}const idx=arr.findIndex(m=>m.id===state.cursorId);if(idx<=0)return;state.cursorId=arr[idx-1].id;state.doneIds=state.doneIds.filter(x=>x!==state.cursorId);commit({scrollTop:true});}
  function switchMode(mode){state.mode=mode;commit({scrollTop:true});}
  function downloadJSON(){
    const date=new Date().toISOString().slice(0,10);
    const name=(state.name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_').slice(0,38)||'SHOW');
    const output={...state,exportedAt:new Date().toISOString(),app:'SOWN Cue Monitor V0.1'};
    const blob=new Blob([JSON.stringify(output,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`SOWN_${name}_${date}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Đã tạo file JSON để lưu/chia sẻ.');
  }
  async function importJSON(file){
    if(!file)return;
    if(file.size>3*1024*1024) {toast('File quá lớn (tối đa 3 MB).');return;}
    try {const s=normalize(JSON.parse(await file.text()));if(!confirm(`Nhập show “${s.name}”?\n\nDữ liệu hiện tại trên máy sẽ bị thay thế. Hãy xuất backup trước khi nhập.`))return;state=s;commit({scrollTop:true});toast('Đã nhập show thành công.');}
    catch(err){alert('Không nhập được file: '+err.message);}
  }
  function handleButton(e){

    switch(action){
      case 'switch-mode': switchMode(b.dataset.mode);break;
      case 'rename-show':openDialog('show');break;
      case 'add-section':openDialog('section');break;
      case 'edit-section':openDialog('section',id);break;
      case 'add-moment':openDialog('moment',null,b.dataset.sectionId);break;
      case 'edit-moment':{const target=locateMoment(id);if(target)openDialog('moment',id,target.section.id);break;}
      case 'select-section':{
        const s=findSection(id);if(!s)return;
        if(state.mode==='show') {if(!s.moments.length){toast('Phần này chưa có Key Moment.');return;}if(!confirm(`Chuyển đến moment đầu tiên của “${s.name}”?`))return;state.cursorId=s.moments[0].id;state.ended=false;}
        else state.selectedSectionId=id;
        commit({scrollTop:true});break;
      }
      case 'section-up':case 'section-down':{const i=state.sections.findIndex(s=>s.id===state.selectedSectionId);moveItem(state.sections,i,action==='section-up'?-1:1);commit();break;}
      case 'delete-section':{
        const s=findSection(id);if(!s||!confirm(`Xóa phần “${s.name}” và toàn bộ ${s.moments.length} moment bên trong?\n\nKhông thể hoàn tác nếu chưa có backup.`))return;
        state.sections=state.sections.filter(x=>x.id!==id);ensureCursor();commit();toast('Đã xóa phần.');break;
      }
      case 'moment-up':case 'moment-down':{const loc=locateMoment(id);if(!loc)return;moveItem(loc.section.moments,loc.index,action==='moment-up'?-1:1);commit();break;}
      case 'delete-moment':{
        const loc=locateMoment(id);if(!loc||!confirm(`Xóa Key Moment “${loc.moment.title}”?`))return;
        loc.section.moments.splice(loc.index,1);ensureCursor();commit();toast('Đã xóa moment.');break;
      }
      case 'clone-moment':{
        const loc=locateMoment(id);if(!loc)return;
        loc.section.moments.splice(loc.index+1,0,{...loc.moment,id:newId(),title:loc.moment.title+' (bản sao)'});commit();toast('Đã nhân bản moment.');break;
      }
      case 'next':next();break;
      case 'previous':previous();break;
      case 'jump-moment':{
        const arr=flatMoments(),i=arr.findIndex(m=>m.id===id);if(i<0)return;
        if(!confirm(`Nhảy đến “${arr[i].title}”?\n\nCác moment bị bỏ qua sẽ KHÔNG được đánh dấu hoàn tất.`))return;
        state.cursorId=id;state.ended=false;commit({scrollTop:true});break;
      }
      case 'reset':if(confirm('Đưa show về moment đầu tiên và xóa trạng thái đã hoàn tất?\n\nNội dung ghi chú sẽ được giữ nguyên.')){state.cursorId=flatMoments()[0]?.id||null;state.ended=false;state.doneIds=[];commit({scrollTop:true});toast('Đã reset trạng thái show.');}break;
      case 'new-show':if(confirm('Tạo show mới?\n\nToàn bộ rundown hiện tại sẽ bị thay thế. Hãy xuất backup trước nếu cần.')){
        const sid=newId();state={schema:1,name:'SHOW MỚI',mode:'rehearsal',selectedSectionId:sid,cursorId:null,ended:false,doneIds:[],sections:[{id:sid,name:'OPENING',notes:'',moments:[]}]};commit({scrollTop:true});toast('Đã tạo show mới.');}break;
      case 'export':downloadJSON();break;
      case 'import':$('#importFile').click();break;
      case 'close-dialog':$('#editorDialog').close();break;
    }
  }
  document.addEventListener('click',handleButton);
  $('#editorForm').addEventListener('submit',editorSubmit);
  $('#importFile').addEventListener('change',e=>{importJSON(e.target.files?.[0]);e.target.value='';});
  document.addEventListener('change',e=>{
    if(e.target.id==='sectionJump'){
      const s=findSection(e.target.value);if(!s?.moments.length){toast('Phần này chưa có Key Moment.');render();return;}
      if(!confirm(`Nhảy đến moment đầu tiên của “${s.name}”?`)){render();return;}
      state.cursorId=s.moments[0].id;state.ended=false;commit({scrollTop:true});
    }
  });
  document.addEventListener('keydown',e=>{
    if(state.mode!=='show'||$('#editorDialog').open||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
    if(e.key==='ArrowRight'){e.preventDefault();next();}
    if(e.key==='ArrowLeft'){e.preventDefault();previous();}
  });
  $('#editorDialog').addEventListener('click',e=>{if(e.target===$('#editorDialog'))$('#editorDialog').close();});
  ensureCursor();save();render();
  if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
})();

</script>
</body>
</html>
